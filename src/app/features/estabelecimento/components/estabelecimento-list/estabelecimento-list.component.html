<div class="page">

    <div class="page-header">
        <h1>Estabelecimentos</h1>

        <button class="btn-primary" (click)="novo()">
            + Novo
        </button>
    </div>

    <!-- barra de pesquisa fora da grid -->
    <div class="search-bar">
        <input type="text" placeholder="Pesquisar estabelecimento..." class="search-input">

        <button class="btn-search">
            Pesquisar
        </button>
    </div>

    <div class="table-card">
        <table>
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Telefone</th>
                    <th>Endereço</th>
                    <th>Modalidades</th>
                    <th>Status</th>
                    <th width="110">Ações</th>
                </tr>
            </thead>

            <tbody>
                <tr *ngFor="let item of estabelecimentoMany()">
                    <td>{{ item.nome }}</td>
                    <td >{{ item.telefone | telefone }}</td>
                    <td>{{ item.endereco }}</td>
                    <td>{{ item.modalidades }}</td>

                    <td>
                        <span class="badge" [class.inativo]="!item.ativo">
                            {{ item.ativo ? 'Ativo' : 'Inativo' }}
                        </span>
                    </td>

                    <td>
                        <button class="btn-edit">
                            Editar
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</div>

<app-estabelecimento-inserir-modal #inserirModal />
